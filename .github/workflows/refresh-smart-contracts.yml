name: Refresh Smart Contracts

on:
  schedule:
    # Every Wednesday at 14:00 UTC
    - cron: '0 13 * * 3'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}
  # Let a running refresh finish; it pushes a branch and opens a PR.
  cancel-in-progress: false

# Secure default: no permissions unless a job opts in below.
permissions: {}

jobs:
  refresh-smart-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the refresh branch
      pull-requests: write # opens the refresh PR
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          # This job pushes the refresh branch with git, so the token must stay
          # available for the life of the job.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Get checksum before update
        id: before
        run: |
          echo "checksum=$(sha256sum data/smart_contracts.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Run update script
        run: python3 scripts/update_smart_contracts.py

      - name: Get checksum after update
        id: after
        run: |
          echo "checksum=$(sha256sum data/smart_contracts.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        env:
          BEFORE: ${{ steps.before.outputs.checksum }}
          AFTER: ${{ steps.after.outputs.checksum }}
        run: |
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in smart_contracts.json"
          fi

      - name: Create branch and PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH_NAME="feat/refresh-smart-contracts-$(date +%Y%m%d-%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add data/smart_contracts.json
          git commit -m "feat(smart_contracts): refresh smart contracts data"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "feat(smart_contracts): refresh smart contracts data" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated weekly refresh of smart contracts data
          - Generated by scheduled workflow

          ## Changes
          Updated \`data/smart_contracts.json\` with latest contract data from GitHub.

          ---
          🤖 This PR was automatically created by the refresh-smart-contracts workflow.
          EOF
          )"
